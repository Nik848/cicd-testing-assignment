name: Automated Testing and Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

  deploy:
    name: Deployment
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Production Dependencies
        run: npm ci --omit=dev

      - name: Build Docker Image
        run: docker build -t cicd-testing-app .

      - name: Deploy Application
        run: |
          docker run -d --name cicd-app -p 3000:3000 cicd-testing-app
          for i in {1..10}; do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs cicd-app
          exit 1
